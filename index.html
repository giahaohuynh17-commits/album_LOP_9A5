<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bộ sưu tập ảnh của tôi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .gallery img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .gallery img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Bộ sưu tập ảnh của tôi</h1>
    <div class="gallery">
        <!-- Thay tên 'hinh-1.jpg', 'hinh-2.jpg' bằng tên ảnh thực tế của bạn -->
        <img src="hinh-1.jpg" alt="Ảnh 1">
        <img src="hinh-2.jpg" alt="Ảnh 2">
        <img src="hinh-3.jpg" alt="Ảnh 3">
        <img src="hinh-4.jpg" alt="Ảnh 4">
        <img src="hinh-5.jpg" alt="Ảnh 5">
        <img src="hinh-6.jpg" alt="Ảnh 6">
        <!-- Thêm các thẻ img khác nếu bạn có nhiều ảnh hơn -->
    </div>

</body>
</html>
